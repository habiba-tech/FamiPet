# =========================================================
# FAMIPET - OPTIONAL: reach an EXTERNAL OmniRoute container
# =========================================================
# Use this override ONLY when OmniRoute already runs on this host in a
# DIFFERENT Docker Compose project (e.g. EduTech). OmniRoute is NOT a
# service of the FamiPet stack, so the FamiPet backend attaches to the
# network OmniRoute is already on and addresses it by SERVICE NAME:
#
#   PETGPT_OPENAI_BASE_URL=http://omniroute:20128/v1
#
# Why the service name and not an IP: Docker resolves the name through
# its embedded DNS, so it survives container recreation. A 172.x address
# changes every time the container is recreated and silently breaks
# PetGPT - never hardcode one.
#
# Why not host.docker.internal: an OmniRoute published as
# 127.0.0.1:<port> is bound to the HOST loopback only, so a container
# cannot reach it through the docker gateway. Sharing the network is the
# supported way in that setup.
#
# USAGE:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.omniroute.yml up -d
#
# The network name must match where OmniRoute actually runs. It is read
# from OMNIROUTE_NETWORK (default: edutech_default). If that network does
# not exist, create it or point the variable at the right one:
#   docker network create <name>
#
# Then set in backend/.env (the backend's real env file):
#   PETGPT_PROVIDER=openai
#   PETGPT_OPENAI_BASE_URL=http://omniroute:20128/v1
#   PETGPT_OPENAI_API_KEY=<omniroute key>
#   PETGPT_OPENAI_MODEL=auto/best-fast
# =========================================================

services:
  backend:
    networks:
      - famipet-backend-net
      # Resolve + reach the external OmniRoute by service name.
      - omniroute-net

networks:
  omniroute-net:
    name: ${OMNIROUTE_NETWORK:-edutech_default}
    external: true
