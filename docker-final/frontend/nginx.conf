# =========================================================
# FAMIPET - FINAL FRONTEND NGINX CONFIGURATION
# (docker-final: production Dockerization - frontend + backend)
#
# Serves the migrated React SPA (dist/) on port 5502 - the canonical
# frontend port the entry nginx reverse proxy proxies to.
#
# Security / caching posture mirrors the legacy static-frontend config
# AND the Phase-28 React frontend nginx.conf (kept for reference):
#  - server_tokens off hides the nginx version banner.
#  - nosniff / frame / referrer hardening on every response.
#  - NO CSP on purpose: the app loads Google Fonts, Lucide icons and
#    Cloudinary images and uses inline styles; a strict CSP would break
#    the shipped UI (same decision as the previously deployed configs).
#  - HTML revalidates on every load so a new deploy is picked up
#    immediately; Vite's content-hashed bundles under /assets/ are
#    immutable-cached.
#  - SPA fallback: any path that is not a real file returns index.html
#    so React Router deep links (verify-email/reset-password/app pages)
#    resolve on direct navigation and refresh.
# =========================================================

server {
    listen 5502;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Static-server security headers (applied to every response).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               font/woff2 text/plain;

    # Vite emits content-hashed bundles under /assets/ -> cache immutable.
    # add_header is NOT inherited from the server block once a location
    # sets its own, so the security headers are repeated.
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the SPA with an index.html fallback. HTML must
    # revalidate so a new deploy is picked up immediately (same as legacy).
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma no-cache always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}