# =========================================================
# FAMIPET - FINAL NGINX REVERSE PROXY CONFIGURATION
# (docker-final: production Dockerization - frontend + backend)
#
# Single public entry point of the final Compose stack (HTTP on :80).
# Serves the React frontend and reverse-proxies the API + uploads to
# the Express backend, which stays private on the Docker networks.
#
# This file is a byte-for-byte equivalent of the existing deployed
# proxy configuration (habiba/Fami-Pet nginx/nginx.conf): the routing
# and security posture are PRESERVED for the final React stack.
#
# Routing:
#   /api*     -> backend:5000   (Express API, URI preserved)
#   /uploads* -> backend:5000   (uploaded / avatar images)
#   /          -> frontend:5502 (React SPA, index.html fallback)
#
# SECURITY: server_tokens off; nosniff / frame / referrer headers
# on every response. NO Content-Security-Policy on purpose - the app
# loads Google Fonts, Lucide and Cloudinary images and uses inline
# styles/scripts; a strict CSP would break the shipped UI. HSTS is
# intentionally NOT set: HTTPS is terminated at the Cloudflare edge.
#
# CF-AWARE HEADERS: when a request arrives via the Cloudflare Tunnel,
# nginx's $remote_addr is a Cloudflare egress IP and $scheme is
# "http" (inbound on :80). With these maps the backend (trust proxy =
# 1) still sees the REAL client IP via CF-Connecting-IP and the true
# forwarded proto via X-Forwarded-Proto, so rate-limit keys and
# req.protocol/req.secure stay correct behind Cloudflare while direct
# LAN access keeps the normal values.
# =========================================================

# $xff: real client IP when Cloudflare is in front, otherwise the
# usual chain ($remote_addr appended to any inbound XFF).
map $http_cf_connecting_ip $xff {
    "~^$" $proxy_add_x_forwarded_for;
    default $http_cf_connecting_ip;
}

# $proto: preserve Cloudflare's proto (https), else plain $scheme (http).
map $http_x_forwarded_proto $proto {
    "~^$" $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API - original request URI is passed through untouched so
    # /api/... paths (including /api alone) reach Express exactly as sent.
    location ^~ /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $xff;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Uploaded / avatar images served by the backend (Cloudinary fallback).
    location ^~ /uploads {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $xff;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static frontend. The frontend container (nginx, 5502) owns the site
    # content, cache headers and its own index.html fallback.
    location / {
        proxy_pass http://frontend:5502;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $xff;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend limits JSON bodies to 1mb and files to 5MB; keep the proxy
    # cap comfortably above multer's MAX_FILE_SIZE so uploads are unaffected.
    client_max_body_size 10m;
}